<section class="main py-5 flex-grow-1 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card shadow-sm p-4 p-md-5 border-0 bg-white rounded-4">
                    <h1 class="h3 fw-bold text-center text-dark mb-4">Sign In</h1>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary">Username or Email:</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter username or email" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">Password:</label>
                            <div class="input-group has-validation">
                                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password" aria-label="Show password" title="Show password">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/></svg>
                                </button>
                                <div class="invalid-feedback" id="loginPasswordError"></div>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="submitbtn btn btn-danger btn-lg shadow-sm" type="submit">Log in</button>
                            <a href="register.html" class="nav-menu-button btn btn-outline-secondary">Need an account? Register</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
