<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="icon" href="./img/logo_title.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white min-vh-100 d-flex align-items-center py-4">
    <div class="container">
        <div class="row justify-content-center">
                <form action="#" method="POST" class="bg-white text-dark rounded-4 p-4 p-sm-5 border border-danger border-3 shadow-lg">
                    <button class="btn btn-danger rounded-3 border-0"><a href="./cart.html" class="text-decoration-none text-reset"><- Back</a></button>
                    <div class="text-center mb-4">
                        <img src="./img/logo_title.png" width="200px" height="200px" alt="">
                        <p class="text-secondary small mb-0">Paying for delivery</p>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="deliveryMethod" id="delivery" checked>
                            <label class="btn btn-outline-danger w-100 fw-semibold" for="delivery">Delivery</label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="deliveryMethod" id="pickup">
                            <label class="btn btn-outline-danger w-100 fw-semibold" for="pickup">Self-pickup</label>
                        </div>
                    </div>
                    <hr class="border-secondary-subtle my-3">
                    <h6 class="fw-bold text-danger text-uppercase small mb-2">1. Contacts</h6>
                    <div class="row g-2 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold mb-1" for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Alimger" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold mb-1" for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 999 000-00-00" required>
                        </div>
                    </div>
                    <h6 class="fw-bold text-danger text-uppercase small mb-2">2. Address to delivery</h6>
                    <div class="mb-2">
                        <input type="text" name="address" class="form-control" placeholder="Street and number of house" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <input type="text" class="form-control text-center px-1" placeholder="Apartment">
                        </div>
                        <div class="col-4">
                            <input type="text" class="form-control text-center px-1" placeholder="Entrance">
                        </div>
                        <div class="col-4">
                            <input type="text" class="form-control text-center px-1" placeholder="Floor">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded mb-3 border">
                        <span class="small fw-semibold">Count of food tools:</span>
                        <input type="number" name="persons" class="form-control text-center" value="2" min="1" max="10" style="width: 70px;">
                    </div>
                    <hr class="border-secondary-subtle my-3">
                    <h6 class="fw-bold text-danger text-uppercase small mb-2">3. Card info</h6>
                    <div class="mb-2">
                        <label for="cardNumber" class="form-label small fw-semibold mb-1">Card number</label>
                        <input type="text" class="form-control" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19" required>
                    </div>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label for="expiry" class="form-label small fw-semibold mb-1">expiry date</label>
                            <input type="text" class="form-control text-center" placeholder="12/28" inputmode="numeric" maxlength="5" required>
                        </div>
                        <div class="col-6">
                            <label for="cvv" class="form-label small fw-semibold mb-1">CVV/CVC</label>
                            <input type="password" class="form-control text-center" placeholder="•••" inputmode="numeric" maxlength="3"required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-semibold">Morimoto Set (Sample Item)</span>
                        <span class="fw-bold fs-5 text-danger">6,250 ₸</span>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-3 fw-bold text-uppercase rounded-3 shadow">Pay for delivery</button>
                </form>
        </div>
    </div>
</body>
</html>
