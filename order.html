<!DOCTYPE html>
<html lang="en">
<!--David Naumkin-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="icon" href="./img/logo_title.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white min-vh-100 d-flex align-items-center py-4">
    <div class="container">
        <div class="row justify-content-center">
            <form id="orderForm" action="#" method="POST" class="bg-white text-dark rounded-4 p-4 p-sm-5 border border-danger border-3 shadow-lg" novalidate>
                <a href="./cart.html" class="btn btn-danger rounded-3 border-0 text-decoration-none"><- Back</a>
                <div class="text-center mb-4">
                    <img src="./img/logo_title.png" width="200px" height="200px" alt="">
                    <p class="text-secondary small mb-0">Paying for delivery</p>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="deliveryMethod" id="delivery" checked>
                        <label class="btn btn-outline-danger w-100 fw-semibold" for="delivery">Delivery</label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="deliveryMethod" id="pickup">
                        <label class="btn btn-outline-danger w-100 fw-semibold" for="pickup">Self-pickup</label>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="address" id="address1" checked>
                        <label class="btn btn-outline-danger w-100 fw-semibold" for="address1">Bauyrzhan Momyshuly 2a</label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="address" id="address2">
                        <label class="btn btn-outline-danger w-100 fw-semibold" for="address2">Syganak 11</label>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-center align-items-center gap-3">
                        <label for="orderTime" class="form-label small fw-semibold text-danger mb-0 text-nowrap">Delivery time</label>
                        <select class="form-select border-secondary-subtle" id="orderTime" name="order_time" required>
                            <option value="asap" selected>As soon as possible (~35–45 min.)</option>
                            <optgroup label="Today (step by 30 minutes)">
                                <option value="10:30">10:30</option>
                                <option value="11:00">11:00</option>
                                <option value="11:30">11:30</option>
                                <option value="12:00">12:00</option>
                                <option value="12:30">12:30</option>
                                <option value="13:00">13:00</option>
                                <option value="13:30">13:30</option>
                                <option value="14:00">14:00</option>
                                <option value="14:30">14:30</option>
                                <option value="15:00">15:00</option>
                                <option value="15:30">15:30</option>
                                <option value="16:00">16:00</option>
                                <option value="16:30">16:30</option>
                                <option value="17:00">17:00</option>
                                <option value="17:30">17:30</option>
                                <option value="18:00">18:00</option>
                                <option value="18:30">18:30</option>
                                <option value="19:00">19:00</option>
                                <option value="19:30">19:30</option>
                                <option value="20:00">20:00</option>
                                <option value="20:30">20:30</option>
                                <option value="21:00">21:00</option>
                                <option value="21:30">21:30</option>
                                <option value="22:00">22:00</option>
                                <option value="22:30">22:30</option>
                                <option value="23:00">23:00</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <hr class="border-secondary-subtle my-3">
                <h6 class="fw-bold text-danger text-uppercase small mb-2">1. Contacts</h6>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-semibold mb-1" for="name">Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Alimger" required>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-semibold mb-1" for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 (777) 777-77-77" maxlength="18" required>
                    </div>
                </div>
                <h6 class="fw-bold text-danger text-uppercase small mb-2">2. Address to delivery</h6>
                <div class="mb-2">
                    <input type="text" id="orderAddress" name="address" class="form-control" placeholder="Street and number of house" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-4">
                        <input type="text" id="apartment" class="form-control text-center px-1" placeholder="Apartment" maxlength="6">
                    </div>
                    <div class="col-4">
                        <input type="text" id="entrance" class="form-control text-center px-1" placeholder="Entrance" inputmode="numeric" maxlength="2">
                    </div>
                    <div class="col-4">
                        <input type="text" id="floor" class="form-control text-center px-1" placeholder="Floor" inputmode="numeric" maxlength="3">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded border">
                        <label for="persons" class="small fw-semibold mb-0">Count of food tools:</label>
                        <input type="number" id="persons" name="persons" class="form-control text-center" value="2" min="1" max="10" style="width: 80px;">
                    </div>
                    <div class="text-danger small mt-1 d-none" id="personsError"></div>
                </div>
                <hr class="border-secondary-subtle my-3">
                <h6 class="fw-bold text-danger text-uppercase small mb-2">3. Card info</h6>
                <div class="mb-2">
                    <label for="cardNumber" class="form-label small fw-semibold mb-1">Card number</label>
                    <input type="text" id="cardNumber" class="form-control" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19" required>
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label for="expiry" class="form-label small fw-semibold mb-1">Expiry date</label>
                        <input type="text" id="expiry" class="form-control text-center" placeholder="12/28" inputmode="numeric" maxlength="5" required>
                    </div>
                    <div class="col-6">
                        <label for="cvv" class="form-label small fw-semibold mb-1">CVV/CVC</label>
                        <input type="password" id="cvv" class="form-control text-center" placeholder="•••" inputmode="numeric" maxlength="3" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-3 fw-bold text-uppercase rounded-3 shadow">Pay for delivery</button>
            </form>
        </div>
    </div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="cart.js"></script>
<script src="auth.js"></script>
</body>
</html>
