<section class="main py-5 flex-grow-1 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card shadow-sm p-4 p-md-5 border-0 bg-white rounded-4">
                    <h1 class="h3 fw-bold text-center text-dark mb-4">Create Account</h1>
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary">Username:</label>
                            <input type="text" id="username" name="Username" class="form-control" placeholder="Enter username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-secondary">Password:</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <div class="mb-4">
                            <label for="check_password" class="form-label fw-semibold text-secondary">Confirm Password:</label>
                            <input type="password" id="check_password" name="check_password" class="form-control" placeholder="Confirm password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <input class="submitbtn btn btn-danger btn-lg shadow-sm" type="submit" value="Register">
                            <a href="login.html" class="nav-menu-button btn btn-outline-secondary">Already have an account? Log in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
