                <img src="./img/placeholder.png" alt="" width="80px" height="80px">
                <p class="cart-item-name">Item name</p>

                <input type="number" class="cart-item-qty" value="1" min="1">

        </ul>

        <article class="cart-summary">
            <p>Total: <span class="cart-total">0 ₸</span></p>
            <button class="cart-checkout">Checkout</button>
        </article>
    </section>
